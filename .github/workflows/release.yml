name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/package-version.sh

  build:
    needs: version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: yoo-${{ github.ref_name }}-linux-x86_64
            binstall_archive: yoo-${{ github.ref_name }}-x86_64-unknown-linux-gnu
            binary_name: yoo
            raw_name: yoo-linux-x86_64
            archive_extension: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: yoo-${{ github.ref_name }}-macos-aarch64
            binstall_archive: yoo-${{ github.ref_name }}-aarch64-apple-darwin
            binary_name: yoo
            raw_name: yoo-macos-aarch64
            archive_extension: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: yoo-${{ github.ref_name }}-windows-x86_64
            binstall_archive: yoo-${{ github.ref_name }}-x86_64-pc-windows-msvc
            binary_name: yoo.exe
            raw_name: yoo-windows-x86_64.exe
            archive_extension: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare raw binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force raw | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" `
            "raw/${{ matrix.raw_name }}"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.target }}
          path: raw/${{ matrix.raw_name }}
          if-no-files-found: error

      - name: Package Unix archives
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "staging/${{ matrix.archive }}" \
            "staging/${{ matrix.binstall_archive }}" \
            dist

          cp \
            "target/${{ matrix.target }}/release/yoo" \
            README.md \
            LICENSE \
            "staging/${{ matrix.archive }}/"

          cp \
            "target/${{ matrix.target }}/release/yoo" \
            README.md \
            LICENSE \
            "staging/${{ matrix.binstall_archive }}/"

          tar \
            -C staging \
            -czf "dist/${{ matrix.archive }}.tar.gz" \
            "${{ matrix.archive }}"

          tar \
            -C staging \
            -czf "dist/${{ matrix.binstall_archive }}.tar.gz" \
            "${{ matrix.binstall_archive }}"

      - name: Package Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            "staging/${{ matrix.archive }}", `
            "staging/${{ matrix.binstall_archive }}", `
            "dist" |
            Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/yoo.exe", `
            "README.md", `
            "LICENSE" `
            "staging/${{ matrix.archive }}/"

          Copy-Item `
            "target/${{ matrix.target }}/release/yoo.exe", `
            "README.md", `
            "LICENSE" `
            "staging/${{ matrix.binstall_archive }}/"

          Compress-Archive `
            -Path "staging/${{ matrix.archive }}/*" `
            -DestinationPath "dist/${{ matrix.archive }}.zip"

          Compress-Archive `
            -Path "staging/${{ matrix.binstall_archive }}/*" `
            -DestinationPath "dist/${{ matrix.binstall_archive }}.zip"

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  native-packages:
    needs: version
    uses: ./.github/workflows/packaging.yml

  publish:
    name: Publish GitHub Release
    needs: [build, native-packages]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -lah release

      - name: Generate Homebrew and AUR publication bundle
        run: |
          bash scripts/package-metadata.sh release target/package-metadata
          tar -czf release/yoo-packaging.tar.gz -C target/package-metadata homebrew aur

      - name: Generate SHA-256 checksums
        run: bash scripts/package-checksums.sh release

      - name: Build release notes from changelog
        shell: bash
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          overwrite_files: true
          files: release/*

  publish-tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check optional tap credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        if: steps.credentials.outputs.enabled == 'true'
        with:
          repository: nihitdev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern yoo-packaging.tar.gz
          tar -xzf yoo-packaging.tar.gz homebrew/yoo.rb
          mkdir -p tap/Formula
          cp homebrew/yoo.rb tap/Formula/yoo.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/yoo.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update yoo to $RELEASE_TAG"
            git push
          fi

  publish-snap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check optional Snap Store credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v8
        if: steps.credentials.outputs.enabled == 'true'
        with:
          name: snap-package
          path: snap-artifacts
      - name: Publish to Snap Store candidate channel
        if: steps.credentials.outputs.enabled == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic
          snapcraft upload snap-artifacts/*.snap --release=candidate

  publish-apt:
    needs: publish
    uses: ./.github/workflows/apt-repository.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
      APT_PUBLISH_TOKEN: ${{ secrets.APT_PUBLISH_TOKEN }}
