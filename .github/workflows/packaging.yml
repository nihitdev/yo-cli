name: Packaging

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'site/public/opensuse/**'
      - 'snap/**'
      - 'flake.*'
      - 'scripts/package-*.sh'
      - 'scripts/flatpak-source.sh'
      - 'scripts/opensuse-repository.sh'
      - '.github/workflows/*'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: packaging-tools-${{ runner.os }}-deb-3.8.0-rpm-0.21.0
      - if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - run: |
          set -euo pipefail
          cargo build --release --locked
          bash scripts/package-completions.sh
          git diff --exit-code -- packaging/completions
          cargo deb --no-build
          cargo generate-rpm
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          dpkg-deb -f target/debian/*.deb Depends | grep libc6 >/dev/null
          dpkg-deb -f target/debian/*.deb Depends | grep libgcc-s1 >/dev/null
          sudo apt-get update
          sudo apt-get install -y rpm
          rpm -qp --requires target/generate-rpm/*.rpm
          mkdir -p target/deb-extract target/rpm-extract
          dpkg-deb -x target/debian/*.deb target/deb-extract
          target/deb-extract/usr/bin/yoo --version
          rpm -qpl target/generate-rpm/*.rpm | grep -qx /usr/bin/yoo
          mkdir -p dist
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: native-packages
          path: dist/*
          if-no-files-found: error

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          set -euo pipefail
          bash -n scripts/package-*.sh scripts/flatpak-source.sh packaging/aur/PKGBUILD
          ruby -c packaging/homebrew/yoo.rb
          cargo build --release --locked
          version=$(bash scripts/package-version.sh)
          mkdir -p target/metadata-assets
          # Exercise generation without requiring an already published tag.
          for platform in linux-x86_64 macos-aarch64; do
            tar -czf "target/metadata-assets/yoo-v$version-$platform.tar.gz" -C target/release yoo
          done
          mkdir -p target/metadata-windows
          cp LICENSE target/metadata-windows/
          : > target/metadata-windows/yoo.exe
          (cd target/metadata-windows && zip -q "../metadata-assets/yoo-v$version-windows-x86_64.zip" yoo.exe LICENSE)
          bash scripts/package-metadata.sh target/metadata-assets target/metadata
          ruby -c target/metadata/homebrew/yoo.rb

  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git zip
      - uses: actions/checkout@v6
      - run: |
          set -euo pipefail
          useradd -m builder
          cp -r packaging/aur /tmp/yoo-aur
          chown -R builder:builder /tmp/yoo-aur
          su builder -c 'cd /tmp/yoo-aur && makepkg --printsrcinfo' > /tmp/SRCINFO
          diff -u packaging/aur/.SRCINFO /tmp/SRCINFO
          su builder -c 'cd /tmp/yoo-aur && makepkg --verifysource && makepkg --nodeps'
          version=$(bash scripts/package-version.sh)
          mkdir -p target/metadata-assets
          for platform in linux-x86_64 macos-aarch64; do
            tar -czf "target/metadata-assets/yoo-v$version-$platform.tar.gz" LICENSE
          done
          mkdir -p target/metadata-windows
          cp LICENSE target/metadata-windows/
          : > target/metadata-windows/yoo.exe
          (cd target/metadata-windows && zip -q "../metadata-assets/yoo-v$version-windows-x86_64.zip" yoo.exe LICENSE)
          bash scripts/package-metadata.sh target/metadata-assets /tmp/yoo-generated
          chown -R builder:builder /tmp/yoo-generated
          su builder -c 'cd /tmp/yoo-generated/aur && makepkg --printsrcinfo' > /tmp/generated.SRCINFO
          diff -u /tmp/yoo-generated/aur/.SRCINFO /tmp/generated.SRCINFO

  nix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix run . -- --version
      - name: Install and test Homebrew formula
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew tap-new local/yoo
          cp packaging/homebrew/yoo.rb "$(brew --repository local/yoo)/Formula/yoo.rb"
          brew install local/yoo/yoo
          brew test local/yoo/yoo

  opensuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and install from the static repository in Tumbleweed
        run: |
          set -euo pipefail
          version=$(bash scripts/package-version.sh)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e YOO_VERSION="$version" \
            opensuse/tumbleweed \
            bash -euxo pipefail -c '
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends \
                cargo cargo-packaging rust rpm-build createrepo_c gpg2
              mkdir -p /usr/src/packages/SOURCES
              curl -fsSL "https://github.com/nihitdev/yo-cli/archive/refs/tags/v${YOO_VERSION}.tar.gz" \
                -o "/usr/src/packages/SOURCES/yoo-${YOO_VERSION}.tar.gz"
              cp /workspace/packaging/opensuse/vendor.tar.zst /usr/src/packages/SOURCES/
              sed "s/^Version:.*/Version:        ${YOO_VERSION}/" \
                /workspace/packaging/opensuse/yoo.spec >/tmp/yoo.spec
              rpmbuild -ba /tmp/yoo.spec
              test -f "/usr/src/packages/RPMS/x86_64/yoo-${YOO_VERSION}-0.x86_64.rpm"
              rpm -qpl "/usr/src/packages/RPMS/x86_64/yoo-${YOO_VERSION}-0.x86_64.rpm" | grep -qx /usr/bin/yoo
              mkdir -p /tmp/yoo-repo/packages
              cp "/usr/src/packages/RPMS/x86_64/yoo-${YOO_VERSION}-0.x86_64.rpm" /tmp/yoo-repo/packages/
              createrepo_c --update /tmp/yoo-repo
              printf "%s\\n" "[yoo]" "name=yoo" "baseurl=http://127.0.0.1:18080/" "enabled=1" "gpgcheck=0" "repo_gpgcheck=0" >/etc/zypp/repos.d/yoo.repo
              python3 -m http.server 18080 --directory /tmp/yoo-repo >/tmp/yoo-http.log 2>&1 &
              server=$!
              trap "kill $server" EXIT
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends yoo
              test "$(yoo --version)" = "yoo ${YOO_VERSION}"
            '

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build APK natively on Alpine
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-alpine"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e RELEASE_TAG="${GITHUB_REF_NAME:-}" \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache alpine-sdk cargo rust
              adduser -D builder
              addgroup builder abuild
              mkdir -p /home/builder/packages/yoo /home/builder/.abuild
              sh /workspace/scripts/alpine-build.sh
            '
          test -n "$(find dist-alpine -name 'yoo-*.apk' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-package
          path: dist-alpine/*.apk
          if-no-files-found: error

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: snapcore/action-build@v1
        id: build
      - run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap run yoo --version
      - uses: actions/upload-artifact@v7
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08
          bash scripts/flatpak-source.sh
          flatpak-builder --user --disable-rofiles-fuse --repo=target/flatpak-repo target/flatpak-build packaging/flatpak/io.github.nihitdev.yoo.yml
          flatpak build-bundle target/flatpak-repo "target/yoo-$(bash scripts/package-version.sh)-x86_64.flatpak" io.github.nihitdev.yoo
          flatpak-builder --run target/flatpak-build packaging/flatpak/io.github.nihitdev.yoo.yml yoo --version
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-package
          path: target/*.flatpak
          if-no-files-found: error
