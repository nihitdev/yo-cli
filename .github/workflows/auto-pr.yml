name: Open pull request

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  open-pull-request:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name != github.event.repository.default_branch &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open a pull request for this branch
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, "");
            const base = context.payload.repository.default_branch;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              core.info(`Pull request #${existing.data[0].number} already exists for ${branch}.`);
              return;
            }

            const commits = context.payload.commits ?? [];
            const subjects = commits
              .map(({ message }) => message.split(/\r?\n/, 1)[0].trim())
              .filter(Boolean);
            const latestSubject = context.payload.head_commit?.message
              ?.split(/\r?\n/, 1)[0]
              ?.trim();
            const title = (latestSubject || `${branch}: automated pull request`).slice(0, 250);
            const changes = subjects.length
              ? subjects.map((subject) => `- ${subject}`).join("\n")
              : `- Changes pushed to \`${branch}\`.`;
            const body = [
              "## What changed?",
              "",
              changes,
              "",
              "## Why?",
              "",
              `Automatically opened for the \`${branch}\` branch. See the commits above for context.`,
              "",
              "## Validation",
              "",
              "CI runs automatically on this pull request.",
              "",
              "## Release impact",
              "",
              "Review whether package manifests, release assets, or hosted repositories are affected.",
            ].join("\n");

            const pullRequest = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base,
              title,
              body,
              draft: false,
            });
            core.info(`Opened ${pullRequest.data.html_url}`);
