name: Publish openSUSE repository

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      RPM_SIGNING_KEY:
        required: false
      RPM_SIGNING_PASSPHRASE:
        required: false
      RPM_PUBLISH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yoo-opensuse-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check optional signing and publication credentials
        id: credentials
        env:
          KEY: ${{ secrets.RPM_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
          TOKEN: ${{ secrets.RPM_PUBLISH_TOKEN }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PASSPHRASE" ] && [ -n "$TOKEN" ]; then
            echo enabled=true >> "$GITHUB_OUTPUT"
          else
            echo 'openSUSE publication skipped: configure RPM_SIGNING_KEY, RPM_SIGNING_PASSPHRASE and RPM_PUBLISH_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v6
        if: steps.credentials.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RPM_PUBLISH_TOKEN }}
      - name: Install RPM repository tools
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm gnupg
      - name: Download release RPM
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p target/opensuse-download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'yoo-*.x86_64.rpm' --dir target/opensuse-download
          packages=(target/opensuse-download/yoo-*.x86_64.rpm)
          [[ ${#packages[@]} == 1 && -f "${packages[0]}" ]]
          echo "RPM_FILE=${packages[0]}" >> "$GITHUB_ENV"
      - name: Sign and generate repository
        if: steps.credentials.outputs.enabled == 'true'
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RPM_SIGNING_KEY" | gpg --batch --import
          export RPM_SIGNING_KEY_ID
          RPM_SIGNING_KEY_ID=$(gpg --batch --show-keys --with-colons site/public/opensuse/RPM-GPG-KEY-yoo | awk -F: '$1 == "fpr" {print $10; exit}')
          [[ -n "$RPM_SIGNING_KEY_ID" ]]
          bash scripts/opensuse-repository.sh "$RPM_FILE"
          rpm --checksig --verbose site/public/opensuse/packages/*.rpm
      - name: Commit public repository for Vercel Git deployment
        if: steps.credentials.outputs.enabled == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/public/opensuse
          if ! git diff --cached --quiet; then
            git commit -m 'Update signed yoo openSUSE repository'
            git push origin "HEAD:$BRANCH"
          fi
