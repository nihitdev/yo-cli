name: Feature request
description: Suggest an improvement to yoo
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this help you accomplish?
    validations: { required: true }
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
