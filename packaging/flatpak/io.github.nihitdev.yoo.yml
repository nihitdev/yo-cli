app-id: io.github.nihitdev.yoo
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: yoo

finish-args:
  - --filesystem=host:ro

modules:
  - name: yoo
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/yoo/cargo
    build-commands:
      - mkdir -p .cargo
      - cp cargo-config.toml .cargo/config.toml
      - cargo build --release --locked --offline
      - install -Dm755 target/release/yoo /app/bin/yoo
      - install -Dm755 /usr/bin/git /app/bin/git
      - cp -a /usr/libexec/git-core /app/libexec/
      - cp -a /usr/share/git-core /app/share/
      - install -Dm644 LICENSE /app/share/licenses/yoo/LICENSE
      - install -Dm644 README.md /app/share/doc/yoo/README.md
      - install -Dm644 io.github.nihitdev.yoo.metainfo.xml /app/share/metainfo/io.github.nihitdev.yoo.metainfo.xml
    sources:
      - type: archive
        path: ../../target/flatpak/yoo-source.tar.gz
      - type: file
        path: io.github.nihitdev.yoo.metainfo.xml
