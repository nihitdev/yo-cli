[package]
name = "yoo"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nihit"]
description = "Local CLI for project, Git, and development environment information."
license = "GPL-3.0-or-later"
repository = "https://github.com/nihitdev/yo-cli"
homepage = "https://nihitdev.github.io"
documentation = "https://docs.rs/yoo"
readme = "README.md"
keywords = ["cli", "terminal", "developer", "productivity", "environment"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
