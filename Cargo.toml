[package]
name = "yoo"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nihit"]
description = "Local CLI for project, Git, and development environment information."
license = "GPL-3.0-or-later"
repository = "https://github.com/nihitdev/yo-cli"
homepage = "https://nihitdev.github.io"
documentation = "https://docs.rs/yoo"
readme = "README.md"
keywords = ["cli", "terminal", "developer", "productivity", "environment"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"

[package.metadata.deb]
maintainer = "Nihit <nihitdev@users.noreply.github.com>"
copyright = "Nihit"
license-file = ["LICENSE", "0"]
# cargo-deb intentionally omits libgcc from auto-detected dependencies.
depends = "$auto, libgcc-s1"
suggests = "git"
extended-description = "Inspect local projects, Git status and development tools, generate shell completions, and run coding-session timers. No daemon or network service is required."
section = "utils"
priority = "optional"
assets = [
  ["target/release/yoo", "usr/bin/yoo", "755"],
  ["README.md", "usr/share/doc/yoo/README.md", "644"],
  ["packaging/completions/yoo.bash", "usr/share/bash-completion/completions/yoo", "644"],
  ["packaging/completions/_yoo", "usr/share/zsh/site-functions/_yoo", "644"],
  ["packaging/completions/yoo.fish", "usr/share/fish/vendor_completions.d/yoo.fish", "644"],
]

[package.metadata.generate-rpm]
release = "1"
require-sh = false
assets = [
  { source = "target/release/yoo", dest = "/usr/bin/yoo", mode = "755" },
  { source = "LICENSE", dest = "/usr/share/licenses/yoo/LICENSE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/yoo/README.md", mode = "644", doc = true },
  { source = "packaging/completions/yoo.bash", dest = "/usr/share/bash-completion/completions/yoo", mode = "644" },
  { source = "packaging/completions/_yoo", dest = "/usr/share/zsh/site-functions/_yoo", mode = "644" },
  { source = "packaging/completions/yoo.fish", dest = "/usr/share/fish/vendor_completions.d/yoo.fish", mode = "644" },
]

[package.metadata.generate-rpm.suggests]
git = "*"
